name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Syntax check + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check lib/client.js
        run: node --check lib/client.js

      - name: Syntax check lib/index.js
        run: node --check lib/index.js

      - name: Run tests
        run: npm test
